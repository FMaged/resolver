# ============================================
# BUILD SYSTEM (REQUIRED FOR PACKAGING)
# ============================================

[build-system]
# Packages required to build your project
requires = ["setuptools>=61.0", "wheel"]

# Backend used to build the package
# Common options:
# - setuptools.build_meta
# - poetry.core.masonry.api
# - hatchling.build
build-backend = "setuptools.build_meta"


# ============================================
# PROJECT METADATA (PEP 621 STANDARD)
# ============================================

[project]
name = "myapp"                # Package name (used by pip)
version = "0.1.0"            # Version (required unless dynamic)
description = "My Python application"
readme = "README.md"         # Path to README file

# Python version requirement
requires-python = ">=3.10"

# License (choose one)
license = { text = "MIT" }
# license = { file = "LICENSE" }

# Authors
authors = [
    { name = "Your Name", email = "you@example.com" }
]

# Maintainers (optional)
maintainers = [
    { name = "Maintainer Name", email = "maintainer@example.com" }
]

# Keywords (for PyPI search)
keywords = ["cli", "service", "tool"]

# Classifiers (PyPI metadata)
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

# ============================================
# DEPENDENCIES (IMPORTANT)
# ============================================

# Runtime dependencies (installed automatically)
dependencies = [
    "pydantic>=2.0",
    "dynaconf>=3.0"
]

# Optional dependencies (extras)
[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

# Install with:
# pip install myapp[dev]


# ============================================
# ENTRY POINTS (CLI COMMANDS)
# ============================================

[project.scripts]
# Creates executable command:
# myapp → runs myapp.main:main()
myapp = "myapp.main:main"

# GUI apps (rare)
[project.gui-scripts]
# myapp-gui = "myapp.gui:start"


# ============================================
# URLS (OPTIONAL)
# ============================================

[project.urls]
Homepage = "https://example.com"
Repository = "https://github.com/example/myapp"
Documentation = "https://docs.example.com"


# ============================================
# DYNAMIC FIELDS (OPTIONAL)
# ============================================

# Used when values are generated dynamically
# Example: version from git
# dynamic = ["version"]


# ============================================
# SETUPTOOLS CONFIGURATION
# ============================================

[tool.setuptools]

# If using src/ layout
package-dir = { "" = "src" }

# Explicit package list
# packages = ["myapp"]

# OR automatic discovery (recommended)
[tool.setuptools.packages.find]
where = ["src"]


# Include additional files inside packages
[tool.setuptools.package-data]
myapp = ["*.json", "*.yaml", "*.txt"]


# ============================================
# BUILD OPTIONS (SETUPTOOLS)
# ============================================

[tool.setuptools.dynamic]
# Example: dynamic version from file
# version = { attr = "myapp.__version__" }


# ============================================
# BLACK (FORMATTER)
# ============================================

[tool.black]
line-length = 88
target-version = ["py310"]


# ============================================
# RUFF (LINTER)
# ============================================

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]


# ============================================
# PYTEST (TESTING)
# ============================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"


# ============================================
# COVERAGE (TEST COVERAGE)
# ============================================

[tool.coverage.run]
branch = true
source = ["myapp"]

[tool.coverage.report]
show_missing = true


# ============================================
# MYPY (TYPE CHECKING)
# ============================================

[tool.mypy]
python_version = "3.10"
strict = true


# ============================================
# ISORT (IMPORT SORTING)
# ============================================

[tool.isort]
profile = "black"


# ============================================
# CUSTOM TOOL CONFIGS
# ============================================

# Any tool can store config here
[tool.my_custom_tool]
option = "value"


# ============================================
# NOTES / BEST PRACTICES
# ============================================

# - Always define dependencies in [project.dependencies]
# - Use [project.scripts] for CLI tools (important for .deb)
# - Prefer src/ layout for clean imports
# - Use version pinning for reproducible builds
# - Keep this file as the single source of truth